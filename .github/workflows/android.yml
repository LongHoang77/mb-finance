name: Build Android APK

on:
  push:
    paths:
      - "mb-finance/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

# Đăng bản phát hành (GitHub Releases) để app tự cập nhật
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mb-finance/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # versionCode luôn tăng theo số lần chạy → app so với bản đang cài để biết có bản mới
      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.5.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thu-chi-mb-apk
          path: mb-finance/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Chỉ nhánh main mới thành bản cập nhật cho app; giữ 5 bản gần nhất
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk thu-chi-mb.apk
          git log -1 --pretty=%B > notes.txt
          tag="build-$VERSION_CODE"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" thu-chi-mb.apk --title "$VERSION_NAME" --notes-file notes.txt --target "$GITHUB_SHA" --latest
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
