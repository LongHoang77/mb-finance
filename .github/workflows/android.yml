name: Build Android APK

on:
  push:
    paths:
      - "mb-finance/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mb-finance/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thu-chi-mb-apk
          path: mb-finance/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
